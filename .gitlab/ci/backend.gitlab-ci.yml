variables:
  DOCKER_REGISTRY: "$CI_REGISTRY"
  BASE_IMAGE_NAME: "$CI_REGISTRY/$CI_PROJECT_PATH"
  ZMOVIE_IMAGE_NAME: "$BASE_IMAGE_NAME/api"
  SERVER_IMAGE_NAME: "$BASE_IMAGE_NAME/server"
  DOCKER_TAG: "latest"
  DOCKER_BUILDKIT: "0"
  BACKEND_PATH: "backend/"

# Use GitLab's CI/CD cache more effectively
cache:
  key: "$CI_COMMIT_REF_SLUG"  # Better key using ref slug
  paths:
    - .docker/cache

.if-mr-to-dev-main: &if-mr-to-dev-main
  if: '$CI_PIPELINE_SOURCE == "merge_request_event" &&
    ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" ||
    $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")'

zmovie_build:
  stage: app_build
  rules:
      - <<: *if-mr-to-dev-main
  allow_failure: false
  # Add before_script to set up cache directory
  before_script:
    - export DOCKER_CONFIG="$CI_PROJECT_DIR/.docker/config"
    - mkdir -p .docker/cache "$DOCKER_CONFIG"
    - |
      AUTH="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$DOCKER_REGISTRY" "$AUTH" > "$DOCKER_CONFIG/config.json"
  script:
    - echo "Using CI Docker registry credentials from DOCKER_CONFIG..."
    - echo Building Docker image

    - |
      docker build \
        --cache-from=$ZMOVIE_IMAGE_NAME:$DOCKER_TAG \
        -t $ZMOVIE_IMAGE_NAME:$DOCKER_TAG \
        -t $ZMOVIE_IMAGE_NAME:$CI_COMMIT_SHORT_SHA \
        -f docker/backend.Dockerfile \
        $BACKEND_PATH

    - echo "Pushing Docker image to registry..."
    - docker push $ZMOVIE_IMAGE_NAME:$DOCKER_TAG
    - docker push $ZMOVIE_IMAGE_NAME:$CI_COMMIT_SHORT_SHA

server_build:
  stage: server_build
  rules:
    - <<: *if-mr-to-dev-main
  needs: [zmovie_build]
  before_script:
    - export DOCKER_CONFIG="$CI_PROJECT_DIR/.docker/config"
    - mkdir -p "$DOCKER_CONFIG"
    - |
      AUTH="$(printf '%s:%s' "$DEPLOY_USERNAME" "$DEPLOY_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$DOCKER_REGISTRY" "$AUTH" > "$DOCKER_CONFIG/config.json"
  script:
    - echo "Using deploy Docker registry credentials from DOCKER_CONFIG..."
    - |
      docker build \
        --pull \
        --build-arg API_IMAGE=$ZMOVIE_IMAGE_NAME \
        --build-arg API_TAG=$CI_COMMIT_SHORT_SHA \
        -t $SERVER_IMAGE_NAME:$DOCKER_TAG \
        -t $SERVER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA \
        -f docker/build/zmovie.prod.Dockerfile \
        docker
    - echo "Pushing Docker image to registry..."
    - docker push $SERVER_IMAGE_NAME:$DOCKER_TAG
    - docker push $SERVER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA

deploy_to_portainer:
  stage: deploy
  rules:
    - <<: *if-mr-to-dev-main
  needs: [server_build]
  script:
    - |
      set -euo pipefail
      echo "Deploying to Portainer..."

      for item in $(ruby -rjson -e 'puts JSON.parse(ENV.fetch("PORTAINER_WEBHOOK_URLS"))'); do
        echo "🚀 Processing item: $item";
        curl -fsS -X POST "$item";
      done
