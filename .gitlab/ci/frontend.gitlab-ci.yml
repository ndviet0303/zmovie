variables:
  FRONTEND_PATH: "frontend"
  NITRO_PRESET: "static"
  CF_PAGES_PROJECT_NAME: "zmovie"

.frontend-rules: &frontend-rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    changes:
      - ".gitlab-ci.yml"
      - ".gitlab/ci/frontend.gitlab-ci.yml"
      - "frontend/**/*"
  - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    changes:
      - ".gitlab-ci.yml"
      - ".gitlab/ci/frontend.gitlab-ci.yml"
      - "frontend/**/*"
  - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  - when: never

frontend:lint:
  image:
    name: oven/bun:1
    docker:
      platform: linux/amd64
  stage: verify
  before_script:
    - cd "$FRONTEND_PATH"
    - bun install --frozen-lockfile
  rules: *frontend-rules
  script:
    - bun run lint
    - bun run typecheck
    - bun run generate

.frontend-deploy-base:
  image:
    name: oven/bun:1
    docker:
      platform: linux/amd64
  stage: deploy
  needs:
    - job: "frontend:lint"
      artifacts: false
  before_script:
    - set -eu
    - cd "$FRONTEND_PATH"
    - bun install --frozen-lockfile
    - test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is empty!"; exit 1; }
    - test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is empty!"; exit 1; }
  script:
    - echo "Building $CI_ENVIRONMENT_NAME with API_URL=$NUXT_PUBLIC_API_BASE_URL, NITRO_PRESET=$NITRO_PRESET"
    - bun run generate
    - |
      if [ -f .output/public/index.html ] && [ -d .output/public/_nuxt ]; then
        PAGES_OUTPUT_DIR=".output/public"
      elif [ -f dist/200.html ] && [ -d dist/_nuxt ]; then
        PAGES_OUTPUT_DIR="dist"
      else
        echo "Nuxt generated no deployable output (expected dist/ or .output/public/)"
        exit 1
      fi
      echo "Deploying $PAGES_OUTPUT_DIR"
    - bunx wrangler whoami
    - bunx wrangler pages deploy "$PAGES_OUTPUT_DIR" --project-name="$CF_PAGES_PROJECT_NAME" --branch="$CF_PAGES_BRANCH"
  variables:
    WRANGLER_LOG_PATH: "$CI_PROJECT_DIR/wrangler-logs"
    WRANGLER_LOG_SANITIZE: "true"
  artifacts:
    when: always
    paths:
      - "$FRONTEND_PATH/.nuxt/"
      - "$FRONTEND_PATH/dist/"
      - "$FRONTEND_PATH/.output/"
      - "$FRONTEND_PATH/.output/public/"
      - "wrangler-logs/"
    expire_in: 30 minutes

frontend:deploy:staging:
  extends: .frontend-deploy-base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - ".gitlab-ci.yml"
        - ".gitlab/ci/frontend.gitlab-ci.yml"
        - "frontend/**/*"
      when: manual
    - when: never
  variables:
    CF_PAGES_BRANCH: "staging"
    NUXT_PUBLIC_API_BASE_URL: "https://movie-api.ziet.dev"
  environment:
    name: staging
    url: https://movie.ziet.dev
  resource_group: "frontend-staging"

