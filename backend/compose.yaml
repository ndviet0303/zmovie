services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zmovie
      POSTGRES_USER: zmovie
      POSTGRES_PASSWORD: zmovie
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zmovie -d zmovie"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
