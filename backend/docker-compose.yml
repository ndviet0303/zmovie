services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zmovie_backend_app
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env.docker
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    container_name: zmovie_backend_postgres
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: zmovie
      POSTGRES_USER: zmovie
      POSTGRES_PASSWORD: zmovie_secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zmovie -d zmovie"]
      interval: 5s
      timeout: 5s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.16
    container_name: zmovie_backend_meilisearch
    ports:
      - "${MEILISEARCH_FORWARD_PORT:-7700}:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: zmovie_dev_master_key
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/meili_data

volumes:
  postgres-data:
  meilisearch-data:
  vendor:
